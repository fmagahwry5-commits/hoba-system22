<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>نظام هوبا</title>
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- الشريط العلوي -->
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="القائمة">☰</button>
    <h1 id="shopName" class="shop-name">نظام هوبا</h1>
    <button class="icon-btn" onclick="location.hash='#/invoice/new'" title="فاتورة جديدة">🧾＋</button>
  </header>

  <div class="layout">
    <!-- القائمة الجانبية -->
    <nav id="sidebar" class="sidebar">
      <a href="#/dashboard" data-route="dashboard">📊 لوحة التحكم</a>
      <a href="#/invoice/new" data-route="invoice-new">🧾 فاتورة جديدة</a>
      <a href="#/invoices" data-route="invoices">🗂️ الفواتير</a>
      <a href="#/products" data-route="products">📦 المنتجات</a>
      <a href="#/customers" data-route="customers">👥 العملاء</a>
      <a href="#/expenses" data-route="expenses">💸 المصروفات</a>
      <a href="#/settings" data-route="settings">⚙️ الإعدادات</a>
    </nav>
    <div id="overlay" class="overlay"></div>

    <!-- المحتوى -->
    <main id="view" class="view"></main>
  </div>

  <!-- شريط تنقل سفلي للموبايل -->
  <nav class="bottombar">
    <a href="#/dashboard" data-route="dashboard"><span>📊</span>الرئيسية</a>
    <a href="#/invoice/new" data-route="invoice-new"><span>🧾</span>فاتورة</a>
    <a href="#/products" data-route="products"><span>📦</span>المنتجات</a>
    <a href="#/invoices" data-route="invoices"><span>🗂️</span>الفواتير</a>
  </nav>

  <!-- نافذة منبثقة عامة -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
